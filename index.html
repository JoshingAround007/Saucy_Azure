<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#111c16" />
  <title>Sauce Industries | Welcome</title>
  <style>
    :root { color-scheme: dark; --bg: #111c16; --cream: #f8f5e9; --muted: #b8c5b7; --accent: #e7ef8b; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: var(--bg); color: var(--cream); font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    body::before { content: ""; position: fixed; inset: 0; pointer-events: none; background: radial-gradient(ellipse at 48% 40%, rgba(103,142,84,.16), transparent 52%); }
    .page { min-height: 100vh; display: flex; flex-direction: column; width: min(100% - 48px, 1120px); margin: 0 auto; position: relative; }
    header { padding: 32px 0; display: flex; justify-content: space-between; align-items: center; }
    .brand { display: flex; align-items: center; gap: 12px; text-decoration: none; color: var(--cream); font-size: 17px; font-weight: 750; letter-spacing: -.03em; }
    .mark { height: 34px; width: 34px; background: var(--accent); border-radius: 11px; color: var(--bg); display: grid; place-items: center; font-weight: 900; font-size: 20px; transform: rotate(-8deg); }
    .tag { border: 1px solid #3a4b3b; color: var(--muted); padding: 9px 13px; border-radius: 100px; font-size: 12px; letter-spacing: .08em; text-transform: uppercase; }
    main { flex: 1; display: flex; justify-content: center; align-items: center; padding: 70px 0 100px; text-align: center; }
    .hero { max-width: 850px; }
    .eyebrow { display: inline-flex; gap: 9px; align-items: center; color: var(--accent); font-weight: 650; font-size: 13px; text-transform: uppercase; letter-spacing: .18em; margin-bottom: 28px; }
    .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 16px rgba(231,239,139,.45); }
    h1 { font-size: clamp(3.1rem, 8vw, 6.9rem); line-height: 1.03; letter-spacing: -.075em; margin: 0; font-weight: 800; }
    h1 span { color: var(--accent); }
    p { color: var(--muted); font-size: clamp(1.05rem, 2vw, 1.32rem); line-height: 1.7; margin: 30px auto 0; max-width: 610px; }
    .divider { display: flex; align-items: center; justify-content: center; gap: 17px; margin: 39px auto 0; color: var(--accent); }
    .divider::before, .divider::after { content: ""; width: 66px; height: 1px; background: #475847; }
    .star { font-size: 24px; }
    footer { display: flex; justify-content: space-between; gap: 12px; color: #95a795; border-top: 1px solid #344536; padding: 23px 0 28px; font-size: 13px; }
    @media (max-width: 580px) { .page { width: min(100% - 36px, 1120px); } header { padding-top: 24px; } .tag { display: none; } main { padding: 56px 0 80px; } footer { flex-direction: column; text-align: center; } }
  </style>
</head>
<body>
  <div class="page">
    <header>
      <a class="brand" href="/" aria-label="Sauce Industries home"><span class="mark">S</span> Sauce Industries</a>
      <span class="tag">A little flavor goes a long way</span>
    </header>
    <main>
      <section class="hero" aria-labelledby="welcome">
        <div class="eyebrow"><span class="dot"></span> Official Sauce Industries Website</div>
        <h1 id="welcome">Welcome to<br><span>Sauce Industries!</span></h1>
        <p>You are one of the sauces!</p>
        <div class="divider" aria-hidden="true"><span class="star">✳</span></div>
      </section>
    </main>
    <footer><span>© <span id="year">2026</span> Sauce Industries</span><span>Made with a little extra sauce.</span></footer>
  </div>
  <script>document.getElementById('year').textContent = new Date().getFullYear();</script>
</body>
</html>
